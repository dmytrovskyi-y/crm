{% extends "_base.html" %}

{% block content %}
<h2 class="fw-bold">Detailed information about the service</h2>
<div class="row bg-white px-3 py-3 mx-2 my-5 rounded pb-5 shadow-lg">
    <div class="col"></div>
    <div class="col">
        <div class="card border-dark shadow" style="background: #eee">
            <div class="card-body">
                <h5 class="card-title fw-bold">{{ object.name }}</h5>
                <p class="card-text">{{ object.description }}</p>
                <div class="d-flex justify-content-end fw-bold">{{ object.price }}$</div>
                <div class="d-flex justify-content-center fw-bold">
                    <a href="{% url 'products:update-product' object.id %}" class="btn btn-primary">Edit</a>
                </div>
            </div>
        </div>
    </div>
    <div class="col"></div>
</div>
{% endblock %}
