{% extends "_base.html" %}

{% block content %}
<h2 class="fw-bold">Detailed information about the advertising company</h2>
<div class="row bg-white px-3 py-3 mx-2 my-5 rounded pb-5 shadow-lg">
    <div class="col"></div>
    <div class="col">
        <div class="card border-dark shadow" style="background: #eee">
            <div class="card-body">
                <h5 class="card-title fw-bold">{{ object.name }}</h5>
                {% for service in object.service.all %}
                    <p class="card-text">{{ service.name }}</p>
                {% endfor %}
                <div class="d-flex justify-content-end fw-bold">{{ object.budget }}$</div>
                <div class="d-flex justify-content-center fw-bold">
                    <a href="/ads/{{ object.pk }}/edit" class="btn btn-primary">Edit</a>
                </div>
            </div>
        </div>
    </div>
    <div class="col"></div>
</div>
{% endblock %}
