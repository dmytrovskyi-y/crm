{% extends "_base.html" %}

{% block content %}
    <h2 class="fw-bold">Advertising companies</h2>
    <div class="row bg-white px-3 py-3 mx-2 my-5 rounded pb-5 shadow-lg">
        <div class="hstack gap-3 pb-4">
            <a href="{% url 'advertising:create-ads' %}" class="btn btn-success p-2">Create</a>
            <a href="/ads/statistic" class="btn btn-primary p-2">Statistics</a>
        </div>
        <div class="col">
            <ul class="list-group">
                {% for ad in ads %}
                <li class="list-group-item list-group-item-light d-flex justify-content-between">
                    <a href="{% url 'advertising:detail-ads' ad.pk %}" class="text-decoration-none link-dark">{{ ad.name }}</a>
                    <a href="/ads/{{ ad.pk }}/delete" class="btn btn-danger">Delete</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
{% endblock %}
